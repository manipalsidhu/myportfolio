<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uppu BKL Invoice Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input{
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        
        button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #007BFF;
            color: #fff;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Uppi BKL Invoice Generator</h2>

    <div class="form-group">
        <label for="company">Select Company</label>
        <select id="company" onchange="toggleWeek2Fields()">
            <option value="Trinity Aerospace Corp.">Trinity Aerospace Corp.</option>
            <option value="Programmable Control Systems Ltd.">Programmable Control Systems Ltd.</option>
            <option value="GTEK MFG & TOOLS INC.">GTEK MFG & TOOLS INC.</option>
        </select>
    </div>

    <div class="form-group">
        <label for="invoiceNumber">Invoice Number</label>
        <input type="number" id="invoiceNumber" placeholder="Enter invoice number">
    </div>

    <div class="form-group">
        <label for="date1">Service Date 1 (Week 1)</label>
        <input type="date" id="date1">
    </div>
    <div class="form-group">
        <label for="date2">Service Date 2 (Week 1)</label>
        <input type="date" id="date2">
    </div>

    <div class="form-group" id="hours1Group">
        <label for="hours1">Total Hours (Week 1)</label>
        <input type="number" id="hours1" placeholder="Enter total hours">
    </div>

    <!-- GTEK Amount Field -->
    <div class="form-group" id="amountGroup" style="display: none;">
        <label for="amount">Amount</label>
        <input type="number" id="amount" placeholder="Enter amount">
    </div>

    <!-- Week 2 Fields -->
    <div id="week2Fields">
        <div class="form-group">
            <label for="date3">Service Date 1 (Week 2)</label>
            <input type="date" id="date3">
        </div>
        <div class="form-group">
            <label for="date4">Service Date 2 (Week 2)</label>
            <input type="date" id="date4">
        </div>
        <div class="form-group">
            <label for="hours2">Total Hours (Week 2)</label>
            <input type="number" id="hours2" placeholder="Enter total hours">
        </div>
    </div>

    <button onclick="generateInvoice()">Generate Invoice</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
<script>
    const { jsPDF } = window.jspdf;

    function formatDate(date) {
        const options = { year: 'numeric', month: 'long', day: '2-digit' };
        return new Date(date).toLocaleDateString('en-US', options);
    }

    // Hide/Show Week 2 fields + GTEK amount field
    function toggleWeek2Fields() {
        const company = document.getElementById('company').value;
        const week2 = document.getElementById('week2Fields');
        const hours1Group = document.getElementById('hours1Group');
        const amountGroup = document.getElementById('amountGroup');

        if (company === "Programmable Control Systems Ltd.") {
            week2.style.display = "none";
            hours1Group.style.display = "block";
            amountGroup.style.display = "none";
        } else if (company === "GTEK MFG & TOOLS INC.") {
            week2.style.display = "none";
            hours1Group.style.display = "none";
            amountGroup.style.display = "block";
        } else {
            week2.style.display = "block";
            hours1Group.style.display = "block";
            amountGroup.style.display = "none";
        }
    }

    function generateInvoice() {
        const company = document.getElementById('company').value;
        const invoiceNumber = document.getElementById('invoiceNumber').value;
        const date1 = document.getElementById('date1').value;
        const date2 = document.getElementById('date2').value;
        const hours1 = parseFloat(document.getElementById('hours1').value) || 0;
        const customAmount = parseFloat(document.getElementById('amount').value) || 0;

        let date3 = "", date4 = "", hours2 = 0;
        if (company === "Trinity Aerospace Corp.") {
            date3 = document.getElementById('date3').value;
            date4 = document.getElementById('date4').value;
            hours2 = parseFloat(document.getElementById('hours2').value) || 0;
        }

        // Different hourly rate per company
        let ratePerHour = 0;
        if (company === "Programmable Control Systems Ltd.") {
            ratePerHour = 35;
        } else if (company === "Trinity Aerospace Corp.") {
            ratePerHour = 32.5;
        }

        let amount1 = 0;
        let amount2 = 0;
        let subtotal = 0;

        if (company === "GTEK MFG & TOOLS INC.") {
            subtotal = customAmount;
        } else {
            amount1 = hours1 * ratePerHour;
            amount2 = hours2 * ratePerHour;
            subtotal = amount1 + amount2;
        }

        const hst = subtotal * 0.13;
        const total = subtotal + hst;

        const currentDate = formatDate(new Date());

        const doc = new jsPDF();

        // Right Aligned
        doc.setFontSize(24);
        doc.setFont('helvetica', 'bold');
        doc.text(`Invoice #${invoiceNumber}`, 200, 20, { align: 'right' });

        doc.setFontSize(11);
        doc.setFont('helvetica', 'normal');
        doc.text(`Invoice Date: ${currentDate}`, 200, 30, { align: 'right' });

        // Left Aligned
        doc.setFontSize(11);
        doc.setFont('helvetica', 'bold');
        doc.text("14893786 CANADA INC.", 20, 20);
        doc.setFont('helvetica', 'normal');

        // Add HST line for Programmable and GTEK
        let nextLineY = 25;
        if (company === "Programmable Control Systems Ltd." || company === "GTEK MFG & TOOLS INC.") {
            doc.text("HST #: 762103216", 20, nextLineY);
            nextLineY += 5;
        }

        doc.text("38 Mount Pleasant Dr", 20, nextLineY);
        doc.text("Brampton, ON L6Z 1K2", 20, nextLineY + 5);
        doc.text("+1(647) 501-5372", 20, nextLineY + 10);

        doc.setFont('helvetica', 'bold');
        doc.text("Bill To:", 20, nextLineY + 20);
        doc.setFont('helvetica', 'normal');
        doc.text(company, 20, nextLineY + 25);

        // Table Body
        let tableBody = [];

        if (company === "GTEK MFG & TOOLS INC.") {
            tableBody = [
                [`SERVICES PROVIDED - ${date1} - ${date2}`, `$ ${subtotal.toFixed(2)}`],
                ['HST - @13%', `$ ${hst.toFixed(2)}`],
                ['Total', `$ ${total.toFixed(2)}`]
            ];
        } else {
            tableBody = [
                [`SERVICES PROVIDED - ${date1} - ${date2}`, `$ ${amount1.toFixed(2)}`],
                [`$${ratePerHour.toFixed(2)} @ ${hours1 + hours2} hours`, ``],
                ['HST - @13%', `$ ${hst.toFixed(2)}`],
                ['Total', `$ ${total.toFixed(2)}`]
            ];

            // Add Week 2 line only for Trinity Aerospace
            if (company === "Trinity Aerospace Corp.") {
                tableBody.splice(1, 0, [`SERVICES PROVIDED - ${date3} - ${date4}`, `$ ${amount2.toFixed(2)}`]);
            }
        }

        // Table
        doc.autoTable({
            startY: nextLineY + 35,
            head: [
                [{ content: 'DESCRIPTION', styles: { halign: 'left' } },
                { content: 'AMOUNT', styles: { halign: 'right' } }]
            ],
            body: tableBody,
            headStyles: { fillColor: [232, 248, 245] },
            styles: { textColor: [0, 0, 0], lineWidth: 0.3, lineColor: [173, 216, 230] },
            columnStyles: {
                0: { cellWidth: 130, halign: 'left' },
                1: { cellWidth: 60, halign: 'right' }
            }
        });

        // Centered message
        doc.setFont('helvetica', 'bold');
        doc.text("THANK YOU FOR YOUR BUSINESS!", 105, doc.autoTable.previous.finalY + 20, { align: 'center' });

        doc.save(`Invoice #${invoiceNumber}.pdf`);
    }

    // Initialize correct display on load
    toggleWeek2Fields();
</script>

</body>
</html>
